    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamhaven.dreamkeepers
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Dreamkeepers/Resources/Dreamkeepers.entitlements
    scheme:
      testTargets:
        - DreamkeepersTests
      # Lets Xcode simulate real StoreKit purchases locally (Product ▸ Scheme ▸
      # Edit Scheme ▸ Run ▸ Options already has this pre-selected once
      # regenerated) without needing real App Store Connect IAP products —
      # see Products.storekit / COMPLIANCE_CHECKLIST.md finding #1.
      run:
        storeKitConfiguration: Products.storekit

  DreamkeepersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DreamkeepersTests
    dependencies:
      - target: Dreamkeepers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
