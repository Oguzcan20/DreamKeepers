name: Dreamkeepers
options:
  bundleIdPrefix: com.dreamhaven
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: "48JBM965SN"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_PREVIEWS: true

# NOTE: building this project for a physical device (arm64-apple-ios, not
# simulator) via `xcodebuild -destination 'platform=iOS,id=...' build` with
# no explicit -configuration fails inside GoogleMobileAdsTarget with
# "module map file '.../UserMessagingPlatformTarget.modulemap' not found" —
# an Xcode 26.2 toolchain bug in how it wires the Release-config module map
# for a package-to-package Swift dependency (GoogleMobileAds depends on a
# separate GoogleUserMessagingPlatform package). Confirmed independent of
# GoogleMobileAds's own version (reproduces on both 12.14.0 and 13.x) and
# survives a full DerivedData wipe / package re-resolve — it's specific to
# the Release-iphoneos config, not this app's code. Workaround: build with
# an explicit `-configuration Debug` (and `-sdk iphoneos` in place of
# `-destination`) — see run-device docs / deploy history for the exact
# command. Simulator builds are unaffected either way.
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0

targets:
  Dreamkeepers:
    type: application
    platform: iOS
    sources:
      - path: Dreamkeepers
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      # Google's Consent Management Platform (CMP) — a separate package repo
      # already pulled in transitively by GoogleMobileAds but never linked as
      # an explicit target dependency. Wired up in ConsentManager.swift to
      # satisfy Google's EU User Consent Policy for the app's German/EU user
      # base (see COMPLIANCE_CHECKLIST.md, finding #3).
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    info:
      path: Dreamkeepers/Resources/Info.plist
      properties:
        CFBundleDisplayName: Dreamkeepers
        UILaunchScreen:
          UIImageName: LaunchIcon
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Google Mobile Ads SDK (see AdRewardService.swift / AdMobRewardService.swift).
        # Real AdMob App ID for the "DreamKeepers" app registered in the
        # user's own AdMob console (2026-09-03). The ad UNIT ID in
        # AdMobRewardService.swift is still Google's published TEST rewarded
        # unit, pending a real Rewarded ad unit being created for this app —
        # a real App ID + Google's test ad unit ID together is a normal,
        # safe development combination (the test unit is network-wide, not
        # tied to any one App ID). Swap AdMobRewardService.swift's
        # `adUnitID` for the real one once that ad unit exists.
        GADApplicationIdentifier: ca-app-pub-6011422497566268~3187851752
        GADIsAdManagerApp: false
        # Present, unused for now: the Google Mobile Ads SDK touches
        # IDFA-adjacent APIs even before an explicit ATT request is wired
        # up, and Apple requires this key to exist wherever that's
        # possible. No prompt shows until
        # ATTrackingManager.requestTrackingAuthorization is actually called
        # somewhere — a "before production" follow-up for better-paying
        # personalized ads, not required for test ads to work.
        NSUserTrackingUsageDescription: Dreamkeepers uses this to show ads that are more relevant to you.
        # Google's recommended SKAdNetworkIdentifier list for AdMob (its own
        # exchange plus the third-party buyers it can serve through, even
        # without separate mediation adapters installed) — required by
        # Apple for ad-attribution regardless of which of those buyers
        # actually wins an auction.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
